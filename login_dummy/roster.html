<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名簿管理 - 団体員専用ポータル</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans JP', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">団員名簿管理 (roster)</h1>
            <a href="./testview2.html" class="text-sm text-blue-600 hover:underline">管理メニューに戻る</a>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-xs">
            <h2 class="text-lg font-bold mb-4 text-gray-700">新規団員登録</h2>
            <form id="registerForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">氏名</label>
                    <input type="text" id="regName" class="w-full border border-gray-300 rounded-lg p-2 text-sm" placeholder="山田 太郎" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">メールアドレス (ID)</label>
                    <input type="email" id="regEmail" class="w-full border border-gray-300 rounded-lg p-2 text-sm" placeholder="test@gmail.com" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">パスワード</label>
                    <input type="text" id="regPassword" class="w-full border border-gray-300 rounded-lg p-2 text-sm" placeholder="任意のパスワード" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">所属支部</label>
                    <input type="text" id="regBranch" class="w-full border border-gray-300 rounded-lg p-2 text-sm" placeholder="東京地区支部" value="東京地区支部">
                </div>
                
                <div class="flex items-center gap-3 p-2 border border-gray-200 rounded-lg bg-gray-50">
                    <span class="text-sm font-medium text-gray-700">責任者権限:</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="regRoleToggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white rounded-lg p-2 text-sm font-bold hover:bg-blue-700 transition">登録する</button>
            </form>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 shadow-xs overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-100 text-gray-600 font-medium">
                    <tr>
                        <th class="p-3">ID (メール)</th>
                        <th class="p-3">氏名</th>
                        <th class="p-3">所属支部</th>
                        <th class="p-3">権限</th>
                        <th class="p-3 text-red-600 font-bold">パスワード</th>
                        <th class="p-3">操作</th>
                    </tr>
                </thead>
                <tbody id="rosterTableBody" class="divide-y divide-gray-100">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // 初期メンバーデータ（パスワードと住所を初期配備）
        const defaultMembers = [
            { id: 1, name: "そよかぜ たろう", email: "soyokaze@gmail.com", password: "soyokaze0815", branch: "本部・運営担当", role: "責任者", birthday: "1998年 8月 15日", gender: "男性", tel: "090-1192-8150", status: "有効", address: "東京都千代田区千代田1番1号" },
            { id: 2, name: "山田 太郎", email: "yamada.test@gmail.com", password: "password123", branch: "東京地区支部", role: "一般団体員", birthday: "1995年 3月 10日", gender: "男性", tel: "090-1234-5678", status: "有効", address: "東京都港区六本木6丁目10番1号" },
            { id: 3, name: "佐藤 美咲", email: "sato.misaki_test@outlook.jp", password: "password456", branch: "神奈川地区支部", role: "一般団体員", birthday: "2000年 11月 23日", gender: "女性", tel: "080-9876-5432", status: "保留中", address: "神奈川県横浜市中区新港1丁目1番" }
        ];

        // ローカルストレージにデータがなければ初期データを保存
        if (!localStorage.getItem('portal_members')) {
            localStorage.setItem('portal_members', JSON.stringify(defaultMembers));
        }

        // 表示処理
        function renderRoster() {
            const members = JSON.parse(localStorage.getItem('portal_members'));
            const tbody = document.getElementById('rosterTableBody');
            tbody.innerHTML = '';

            members.forEach(m => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-mono text-xs">${m.email}</td>
                    <td class="p-3 font-bold">${m.name}</td>
                    <td class="p-3 text-gray-500">${m.branch}</td>
                    <td class="p-3">
                        <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ${m.role === '責任者' ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-800'}">
                            ${m.role}
                        </span>
                    </td>
                    <td class="p-3 font-mono font-bold text-red-600 bg-red-50/50">${m.password}</td>
                    <td class="p-3">
                        <button onclick="deleteMember('${m.email}')" class="text-xs text-red-500 hover:underline">削除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 登録イベント
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const name = document.getElementById('regName').value;
            const password = document.getElementById('regPassword').value;
            const branch = document.getElementById('regBranch').value;
            const isManager = document.getElementById('regRoleToggle').checked;
            const role = isManager ? "責任者" : "一般団体員";

            const members = JSON.parse(localStorage.getItem('portal_members'));

            // 重複チェック
            if (members.some(m => m.email === email)) {
                alert('このメールアドレスは既に登録されています！');
                return;
            }

            members.push({
                id: Date.now(),
                name, email, password, branch, role,
                birthday: "未設定", gender: "未設定", tel: "未設定", status: "有効", address: "未設定"
            });

            localStorage.setItem('portal_members', JSON.stringify(members));
            renderRoster();
            this.reset();
        });

        // 削除処理
        window.deleteMember = function(email) {
            if(confirm('本当に削除しますか？')) {
                let members = JSON.parse(localStorage.getItem('portal_members'));
                members = members.filter(m => m.email !== email);
                localStorage.setItem('portal_members', JSON.stringify(members));
                renderRoster();
            }
        };

        // 初回読み込み時に表示
        renderRoster();
    </script>
</body>
</html>

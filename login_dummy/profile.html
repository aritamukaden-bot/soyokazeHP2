<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員登録情報 - 団体員専用ポータル</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Instrument Sans', 'Noto Sans JP', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-xl tracking-tight text-gray-900">団体員専用ポータル</span>
                    <span class="inline-flex items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-800">会員情報</span>
                </div>
                <div>
                    <a href="./testview.html" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition flex items-center gap-1">&larr; ダッシュボードに戻る</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow py-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="mb-8">
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">ご登録情報の確認</h1>
                <p class="mt-1 text-sm text-gray-500">現在システムに登録されているあなたの会員情報です。</p>
            </div>

            <div class="bg-white shadow-xs rounded-2xl border border-gray-100 overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                    <div>
                        <h2 class="text-base font-semibold text-gray-900">基本プロフィール</h2>
                        <p class="text-xs text-gray-500 mt-0.5">アカウントID: <span id="prof-id">---</span></p>
                    </div>
                    <span id="prof-badge" class="inline-flex items-center rounded-full bg-green-50 px-2.5 py-1 text-xs font-semibold text-green-700 ring-1 ring-inset ring-green-200">
                        正規会員
                    </span>
                </div>

                <div class="divide-y divide-gray-100">
                    <div class="px-6 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm font-medium text-gray-500">氏名</dt>
                        <dd id="prof-name" class="mt-1 text-sm text-gray-900 font-semibold sm:col-span-2 sm:mt-0">---</dd>
                    </div>
                    <div class="px-6 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm font-medium text-gray-500">所属支部・グループ</dt>
                        <dd id="prof-branch" class="mt-1 text-sm text-gray-900 sm:col-span-2 sm:mt-0">---</dd>
                    </div>
                    <div class="px-6 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm font-medium text-gray-500">権限レベル</dt>
                        <dd id="prof-role" class="mt-1 text-sm text-gray-900 sm:col-span-2 sm:mt-0">---</dd>
                    </div>
                    <div class="px-6 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm font-medium text-gray-500">生年月日</dt>
                        <dd id="prof-birthday" class="mt-1 text-sm text-gray-900 sm:col-span-2 sm:mt-0">---</dd>
                    </div>
                    <div class="px-6 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm font-medium text-gray-500">性別</dt>
                        <dd id="prof-gender" class="mt-1 text-sm text-gray-900 sm:col-span-2 sm:mt-0">---</dd>
                    </div>
                        <div class="px-6 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm font-medium text-gray-500">住所</dt>
                        <dd id="prof-address" class="mt-1 text-sm text-gray-900 leading-relaxed sm:col-span-2 sm:mt-0">---</dd>
                    </div>
                    <div class="px-6 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
                        <dt class="text-sm font-medium text-gray-500">電話番号</dt>
                        <dd id="prof-tel" class="mt-1 text-sm text-gray-900 sm:col-span-2 sm:mt-0">---</dd>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-gray-400">
            &copy; 2026 団体員専用ポータルサイト. All rights reserved.
        </div>
    </footer>

   <script>
    // セッションから現在ログインしている人のデータを取得
    const currentUser = JSON.parse(localStorage.getItem('current_logged_in_user'));

    if (!currentUser) {
      window.location.href = "./login.html";
    } else {
      // 各データ欄の中身をログインユーザーの情報に書き換える
      document.getElementById('prof-id').innerText = currentUser.email;
      document.getElementById('prof-name').innerText = currentUser.name;
      document.getElementById('prof-branch').innerText = currentUser.branch;
      document.getElementById('prof-role').innerText = currentUser.role;
      document.getElementById('prof-birthday').innerText = currentUser.birthday || "1998年 4月 1日 ";
      document.getElementById('prof-gender').innerText = currentUser.gender || "未設定";
      document.getElementById('prof-tel').innerText = currentUser.tel || "090-0000-0000";
      
      // ✨ここに追加しました！
      document.getElementById('prof-address').innerText = currentUser.address || "東京都千代田区千代田1-1 ";

      // 会員バッジの状態変化
      const badge = document.getElementById('prof-badge');
      if (currentUser.status === '保留中') {
        badge.innerText = "承認保留中";
        badge.className = "inline-flex items-center rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-700 ring-1 ring-inset ring-amber-200";
      } else if (currentUser.status === '休会中') {
        badge.innerText = "休会中";
        badge.className = "inline-flex items-center rounded-full bg-gray-100 px-2.5 py-1 text-xs font-semibold text-gray-700 ring-1 ring-inset ring-gray-200";
      } else {
        badge.innerText = "正規会員";
        badge.className = "inline-flex items-center rounded-full bg-green-50 px-2.5 py-1 text-xs font-semibold text-green-700 ring-1 ring-inset ring-green-200";
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログインページ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333333;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #666666;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover { background-color: #0056b3; }
        .error-message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>団体員ログイン</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="userId">ID</label>
            <input type="email" id="userId" placeholder="メールアドレス" required>
        </div>
        <div class="input-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" placeholder="パスワードを入力" required>
        </div>
        <button type="submit" class="login-btn">ログイン</button>
    </form>
    <div id="errorMessage" class="error-message"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const inputId = document.getElementById('userId').value;
        const inputPass = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');

        // roster.html側で登録されたすべての団員情報を取得
        const members = JSON.parse(localStorage.getItem('portal_members')) || [];
        
        // 入力されたメールアドレスを持つ団員を探す
        const matchedUser = members.find(m => m.email === inputId);

        errorDiv.style.color = "#dc3545";

        if (!matchedUser) {
            errorDiv.textContent = "IDが違います";
        } else if (matchedUser.password !== inputPass) {
            errorDiv.textContent = "パスワードが違います";
        } else {
            // ログイン成功時：マッチした団員データをセッションとして保存
            errorDiv.style.color = "#28a745";
            errorDiv.textContent = "ログインに成功しました！";
            
            localStorage.setItem('current_logged_in_user', JSON.stringify(matchedUser));
            
            alert("ログイン成功！");
            window.location.href = "./testview.html";
        }
    });
    // --- 👇 ここから追加：ログイン画面でも初期データを用意する ---
const defaultMembers = [

    { id: 2, name: "山田 太郎", email: "yamada.test@gmail.com", password: "password123", branch: "東京地区支部", role: "一般団体員", birthday: "1995年 3月 10日", gender: "男性", tel: "090-1234-5678", status: "有効", address: "東京都港区六本木6丁目10番1号" },
    { id: 3, name: "佐藤 美咲", email: "sato.misaki_test@outlook.jp", password: "password456", branch: "神奈川地区支部", role: "一般団体員", birthday: "2000年 11月 23日", gender: "女性", tel: "080-9876-5432", status: "保留中", address: "神奈川県横浜市中区新港1丁目1番" }
];

if (!localStorage.getItem('portal_members')) {

}
</script>
</body>
</html>
